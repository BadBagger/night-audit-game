<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Main pooled blob: layered irregular ellipses, dark oxidized red -->
  <g>
    <ellipse cx="100" cy="112" rx="34" ry="26" transform="rotate(-12 100 112)" fill="#3a0f0f" opacity="0.92"/>
    <ellipse cx="118" cy="108" rx="20" ry="16" transform="rotate(18 118 108)" fill="#40100f" opacity="0.88"/>
    <ellipse cx="82" cy="120" rx="18" ry="14" transform="rotate(-30 82 120)" fill="#360d0d" opacity="0.90"/>
    <ellipse cx="102" cy="128" rx="14" ry="10" transform="rotate(6 102 128)" fill="#2f0b0b" opacity="0.85"/>
  </g>

  <!-- Directional droplet trail flung upward, matching "low against the far wall, wrong angle" -->
  <circle cx="94" cy="88" r="9" fill="#3a0f0f" opacity="0.88"/>
  <circle cx="86" cy="70" r="6.5" fill="#3a0f0f" opacity="0.85"/>
  <circle cx="80" cy="54" r="4.5" fill="#3a0f0f" opacity="0.82"/>
  <circle cx="76" cy="41" r="3" fill="#3a0f0f" opacity="0.78"/>
  <circle cx="108" cy="82" r="5.5" fill="#3a0f0f" opacity="0.84"/>
  <circle cx="116" cy="64" r="3.5" fill="#3a0f0f" opacity="0.8"/>
  <circle cx="122" cy="50" r="2.2" fill="#3a0f0f" opacity="0.75"/>
  <circle cx="66" cy="96" r="4" fill="#3a0f0f" opacity="0.8"/>
  <circle cx="54" cy="86" r="2.5" fill="#3a0f0f" opacity="0.75"/>
  <circle cx="134" cy="94" r="3.2" fill="#3a0f0f" opacity="0.78"/>

  <!-- Fine mist -->
  <circle cx="90" cy="30" r="1.4" fill="#3a0f0f" opacity="0.6"/>
  <circle cx="102" cy="36" r="1.1" fill="#3a0f0f" opacity="0.55"/>
  <circle cx="70" cy="65" r="1.3" fill="#3a0f0f" opacity="0.6"/>
  <circle cx="140" cy="80" r="1.2" fill="#3a0f0f" opacity="0.55"/>

  <!-- Subtle wet-sheen highlight, cool rim per the catalog's light-direction rule -->
  <ellipse cx="92" cy="104" rx="10" ry="5" transform="rotate(-14 92 104)" fill="#5a7d8c" opacity="0.10"/>
  <ellipse cx="112" cy="102" rx="6" ry="3" transform="rotate(10 112 102)" fill="#5a7d8c" opacity="0.08"/>

  <!-- Faint dark edge definition -->
  <ellipse cx="100" cy="112" rx="34" ry="26" transform="rotate(-12 100 112)" fill="none" stroke="#1a0505" stroke-width="0.6" opacity="0.35"/>
</svg>
